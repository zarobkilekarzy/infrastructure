name: Validate

# Walidacja konfiguracji OpenTofu: formatowanie + spójność schematów.
# CELOWO tylko `fmt`/`validate`: NIE uruchamia `plan`/`apply`, nie używa żadnego
# tokenu ani stanu, więc nie dotyka realnej infrastruktury i nie wypisuje do
# jawnych logów żadnych wartości zasobów. `plan`/`apply` robimy lokalnie.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.1"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (tylko providery, bez backendu/stanu)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate
